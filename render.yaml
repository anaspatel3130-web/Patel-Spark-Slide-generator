services:
  - type: web
    name: patelspark-slide-generator
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@patelspark.internal
      - key: ADMIN_PASSWORD
        value: PatelSpark2026!Admin
      - key: NOTIFICATION_EMAIL
        value: anaspatel3130@gmail.com
